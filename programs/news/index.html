<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>MCCICTS News</title>
	<link href="../../lib/os-gui/layout.css" rel="stylesheet" type="text/css">
	<link href="../../lib/os-gui/windows-98.css" rel="stylesheet" type="text/css">
	<link href="../../classic.css" rel="stylesheet" type="text/css">
	<link href="../lib/mccicts-reader.css" rel="stylesheet" type="text/css">
	<link href="news.css" rel="stylesheet" type="text/css">
	<link href="/classic-cursors.css" rel="stylesheet" type="text/css">
	<link rel="icon" href="../../images/icons/help-16x16.png" sizes="16x16" type="image/png">
	<meta name="viewport" content="width=device-width, user-scalable=no">
	<script src="../../config/mccicts-api.js"></script>
	<script src="../lib/mccicts-api-client.js"></script>
</head>
<body>
	<div class="toolbar inset-shallow">
		<button type="button" id="refresh-btn">Refresh</button>
		<button type="button" id="print-btn" disabled>Print</button>
		<button type="button" id="web-btn" disabled>Open on Web</button>
		<span class="spacer"></span>
		<button type="button" id="featured-btn" title="Show featured only">★ Featured</button>
	</div>
	<div class="filter-bar inset-shallow">
		<label>Search <input type="search" id="search-input" placeholder="Title, summary, author…"></label>
		<label>Category
			<select id="category-select"><option value="">All</option></select>
		</label>
		<label>Sort
			<select id="sort-select">
				<option value="newest">Newest first</option>
				<option value="oldest">Oldest first</option>
			</select>
		</label>
	</div>
	<div id="status-line" class="inset-shallow">Loading news from MCCICTS…</div>
	<div class="main-split">
		<div class="list-pane inset-deep">
			<div class="pane-title">Articles</div>
			<div class="list-scroll" id="list-container">
				<ul class="item-list" id="article-list"></ul>
			</div>
		</div>
		<div class="detail-pane inset-deep">
			<div class="pane-title">Article</div>
			<div class="detail-scroll" id="detail-container">
				<div class="detail-empty">Select an article to read.</div>
			</div>
		</div>
	</div>
	<script src="app.js"></script>
</body>
</html>
